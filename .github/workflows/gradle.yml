
name: Build Noctyx Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: current

      - name: Build Noctyx Client
        working-directory: ./NoctyxClient
        run: gradle build

      - name: Upload Noctyx JAR
        uses: actions/upload-artifact@v4
        with:
          name: Noctyx-Client
          path: NoctyxClient/build/libs/*.jar
          if-no-files-found: error
          
